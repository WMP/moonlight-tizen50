name: Sync from clean upstream

# Pulls the clean upstream (moonlight-tizen50-core) into the repo root and re-applies
# the device-integration overlay (patches/), then opens a PR with the result. Nothing
# is merged automatically. If a patch no longer applies, the run fails on purpose so a
# human refreshes the overlay (that is exactly the case worth a human's eyes).

on:
  workflow_dispatch:
    inputs:
      core_branch:
        description: 'Branch of moonlight-tizen50-core to sync from (empty = its default branch)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

env:
  CLEAN_REPO: https://github.com/WMP/moonlight-tizen50-core.git
  # Empty on schedule runs -> the core's default branch. Passed via env, never inlined in run:.
  CORE_BRANCH: ${{ inputs.core_branch }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch clean upstream
        run: |
          set -euo pipefail
          if [ -n "$CORE_BRANCH" ]; then
            git check-ref-format --branch "$CORE_BRANCH" >/dev/null \
              || { echo "::error::invalid branch name: $CORE_BRANCH"; exit 1; }
            git clone --depth 1 --branch "$CORE_BRANCH" "$CLEAN_REPO" /tmp/clean
            # One PR branch per core branch; '/' -> '-' avoids a ref clash with sync/from-clean.
            echo "PR_BRANCH=sync/from-clean-${CORE_BRANCH//\//-}" >> "$GITHUB_ENV"
            echo "SRC_LABEL=moonlight-tizen50-core@$CORE_BRANCH" >> "$GITHUB_ENV"
          else
            git clone --depth 1 "$CLEAN_REPO" /tmp/clean
            echo "PR_BRANCH=sync/from-clean" >> "$GITHUB_ENV"
            echo "SRC_LABEL=moonlight-tizen50-core" >> "$GITHUB_ENV"
          fi
          echo "SRC_SHA=$(git -C /tmp/clean rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Lay down upstream at root + apply overlay
        run: |
          set -euo pipefail
          # Upstream code replaces the tracked tree; this repo's own infra is kept:
          # patches/, this workflow, FUNDING.yml, and .git. The upstream's own
          # AGENTS.md (which forbids RE content) does NOT belong in this repo.
          # The manual engine loader and the engine-load docs are maintained
          # directly here (device-policy workaround, see docs/ENGINE-LOAD.en.md):
          # keep the whole file, the overlay patch 0002 carries only the
          # Program.cs/Diag.cs edits that hook it up.
          rsync -a --delete \
            --exclude='/.git' \
            --exclude='/.gitmodules' \
            --exclude='/third_party' \
            --exclude='/AGENTS.md' \
            --exclude='/patches' \
            --exclude='/pkg/dotnet-host/ManualLoader.cs' \
            --exclude='/docs/ENGINE-LOAD.md' \
            --exclude='/docs/ENGINE-LOAD.en.md' \
            --exclude='/.github/workflows/sync-from-clean.yml' \
            --exclude='/.github/FUNDING.yml' \
            /tmp/clean/ ./
          for p in patches/*.patch; do
            echo "applying $p"
            git apply --whitespace=nowarn "$p" \
              || { echo "::error::$p no longer applies — the upstream changed lines this overlay touches. Refresh patches/ by hand."; exit 1; }
          done

      - name: Open PR with the synced tree
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ env.PR_BRANCH }}
          title: "Sync from clean upstream (${{ env.SRC_LABEL }})"
          commit-message: "sync: pull clean upstream (${{ env.SRC_LABEL }} ${{ env.SRC_SHA }}) + re-apply patches/"
          body: |
            Automated sync: clean upstream (`${{ env.SRC_LABEL }}`, commit `${{ env.SRC_SHA }}`)
            laid down at the repo root, then `patches/*.patch` re-applied.

            Review the diff, then merge. If this PR is empty, the tree already matches
            the upstream + overlay.
          delete-branch: true
