name: Sync from clean upstream

# Brings a branch of moonlight-tizen50-core into this repo while keeping the
# original commits (names, authors, dates, trees) reachable from this repo's
# history: the synced branch merges core's branch as an ancestor, so the PR's
# commit list and `git log` show core's real commits.
#
# Branch mapping (a core branch syncs into the same-named branch here):
#   core main      -> sync/main here (main -> main needs a PR branch), PR into main
#   core <feature> -> <feature> here, PR into main
#
# Mechanism per run:
#   1. merge core's branch with the `ours` strategy — adopts the commits, keeps
#      this repo's tree;
#   2. rebuild the tree deterministically as core's branch + patches/ overlay
#      (same rsync + git apply as before; patches fall back to `git apply
#      --3way` when the exact apply fails, so drifted context merges instead
#      of breaking the run — a real conflict still fails on purpose);
#   3. push the branch and open/update the PR.
#
# If a patch still fails after the 3-way retry, the run fails on purpose so a
# human refreshes the overlay (that is exactly the case worth a human's eyes).

on:
  workflow_dispatch:
    inputs:
      core_branch:
        description: 'Branch of moonlight-tizen50-core to sync from (empty = its default branch)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

env:
  CLEAN_REPO: https://github.com/WMP/moonlight-tizen50-core.git
  # Empty on schedule runs -> the core's default branch. Passed via env, never inlined in run:.
  CORE_BRANCH: ${{ inputs.core_branch }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          # Full history: the sync merge must carry core's commits as ancestors.
          fetch-depth: 0

      - name: Resolve the core branch
        run: |
          set -euo pipefail
          if [ -n "$CORE_BRANCH" ]; then
            git check-ref-format --branch "$CORE_BRANCH" >/dev/null \
              || { echo "::error::invalid branch name: $CORE_BRANCH"; exit 1; }
            echo "CORE_REF=$CORE_BRANCH" >> "$GITHUB_ENV"
          else
            # Empty input -> the core's default branch.
            CORE_REF="$(git ls-remote --symref "$CLEAN_REPO" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}')"
            [ -n "$CORE_REF" ] || { echo "::error::could not resolve the default branch of $CLEAN_REPO"; exit 1; }
            echo "CORE_REF=$CORE_REF" >> "$GITHUB_ENV"
          fi

      - name: Fetch clean upstream
        run: |
          set -euo pipefail
          git fetch --no-tags "$CLEAN_REPO" "+refs/heads/$CORE_REF:refs/remotes/core/$CORE_REF"
          echo "CORE_SHA=$(git rev-parse --short "refs/remotes/core/$CORE_REF")" >> "$GITHUB_ENV"

      - name: Pick the target branch
        run: |
          set -euo pipefail
          if [ "$CORE_REF" = "main" ]; then
            # core main -> main here would have no PR head; use a dedicated branch.
            echo "TARGET_BRANCH=sync/main" >> "$GITHUB_ENV"
          else
            # A feature branch of core syncs into the same-named branch here.
            echo "TARGET_BRANCH=$CORE_REF" >> "$GITHUB_ENV"
          fi

      - name: Merge core history, then rebuild the tree
        run: |
          set -euo pipefail
          git config user.name  github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$TARGET_BRANCH" origin/main

          if git merge-base --is-ancestor "refs/remotes/core/$CORE_REF" HEAD; then
            echo "core $CORE_REF is already an ancestor of main; overlay refresh only"
          else
            # Adopt core's commits as ancestors (names, authors, dates, trees);
            # the tree is rebuilt right after, so 'ours' loses nothing.
            git merge --allow-unrelated-histories --no-ff -s ours -m \
              "sync: merge moonlight-tizen50-core $CORE_REF history ($CORE_SHA); tree rebuilt on top" \
              "refs/remotes/core/$CORE_REF"
          fi

          # Lay the clean upstream down at the repo root; this repo's own infra
          # and device-only files survive as rsync exclusions (full list in
          # patches/README.md):
          #  patches/, this workflow, FUNDING.yml, .gitmodules, third_party/,
          #  AGENTS.md and README.md (this repo keeps its own), ManualLoader.cs,
          #  docs/ENGINE-LOAD*.md (the TV exec-mmap workaround layer).
          rm -rf /tmp/clean
          mkdir /tmp/clean
          git archive "refs/remotes/core/$CORE_REF" | tar -x -C /tmp/clean
          rsync -a --delete \
            --exclude='/.git' \
            --exclude='/.gitmodules' \
            --exclude='/third_party' \
            --exclude='/AGENTS.md' \
            --exclude='/README.md' \
            --exclude='/patches' \
            --exclude='/pkg/dotnet-host/ManualLoader.cs' \
            --exclude='/docs/ENGINE-LOAD.md' \
            --exclude='/docs/ENGINE-LOAD.en.md' \
            --exclude='/.github/workflows/sync-from-clean.yml' \
            --exclude='/.github/FUNDING.yml' \
            /tmp/clean/ ./

          # 1st try: exact apply. On failure, retry with --3way: the merge above
          # made core's commits (and their blob hashes) reachable from this
          # repo, so git can merge the patch onto drifted-but-compatible
          # upstream lines instead of failing on stale context. A real
          # conflict still fails the run (with conflict markers left in the
          # tree, never committed) — that stays a human's job.
          # The git add syncs the index with the rsync'd tree; --3way refuses
          # to touch files that do not match the index.
          git add -A
          for p in patches/*.patch; do
            echo "applying $p"
            if ! git apply --whitespace=nowarn "$p"; then
              echo "::warning::$p needed a 3-way merge — the upstream drifted around lines this overlay touches. Refresh patches/ when convenient."
              git apply --whitespace=nowarn --3way "$p" \
                || { echo "::error::$p no longer applies — the upstream changed lines this overlay touches. Refresh patches/ by hand."; exit 1; }
            fi
          done

          if [ -z "$(git status --porcelain)" ]; then
            echo "tree unchanged after the rebuild; nothing to commit"
            echo "NOTHING_TO_COMMIT=1" >> "$GITHUB_ENV"
          fi

      - name: Commit the rebuilt tree
        if: env.NOTHING_TO_COMMIT != '1'
        run: |
          set -euo pipefail
          git add -A
          git commit -m "sync: rebuild the tree as core $CORE_REF ($CORE_SHA) + overlay"

      - name: Push the branch and open the PR
        if: env.NOTHING_TO_COMMIT != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The branch is generated: replace whatever was there before.
          git push --force origin "$TARGET_BRANCH"

          # An empty diff against main means the sync is already reflected.
          if git diff --quiet origin/main "$TARGET_BRANCH"; then
            echo "the rebuilt tree matches main already; no PR needed"
            exit 0
          fi

          cat > /tmp/pr-body.md <<EOF
          Sync of \`moonlight-tizen50-core $CORE_REF\` (\`$CORE_SHA\`).

          The branch merges core's history first, so the commit list below shows
          core's original commits (names, authors, trees preserved). The tree is
          then rebuilt as core + \`patches/\`, which is what the diff shows.

          Review the diff, then merge.
          EOF

          # Only an OPEN PR counts: `gh pr view <branch>` also returns merged/closed ones.
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $TARGET_BRANCH already open; the push updated it"
            gh pr edit "$TARGET_BRANCH" --repo "$GITHUB_REPOSITORY" \
              --title "Sync from clean upstream (core $CORE_REF @ $CORE_SHA)" \
              --body-file /tmp/pr-body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$TARGET_BRANCH" \
              --title "Sync from clean upstream (core $CORE_REF @ $CORE_SHA)" \
              --body-file /tmp/pr-body.md
          fi
