name: Build image (self-contained build environment)

# Builds pkg/Dockerfile (all build dependencies baked in; the TV's own libraries are
# NOT included) and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/moonlight-tizen-build:deps-<hash>  (hash of the inputs, pkg/image-tag.sh)
#   ghcr.io/<owner>/moonlight-tizen-build:latest
# build-packages.yml pulls the deps-<hash> tag that matches its own checkout.

on:
  workflow_dispatch:
  push:
    tags-ignore: ['**']   # release tag pushes (v*) must not rebuild/re-push the image
    paths:
      - pkg/Dockerfile
      - .dockerignore
      - pkg/image-tag.sh
      - fetch-tizen-sources.sh
      - fetch-backport-deps.sh
      - pkg/dotnet-host/MoonlightHost.csproj
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

# one run per ref at a time: two runs must not race on the same tag
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: img
        run: |
          echo "ref=$(sh pkg/image-ref.sh "$GITHUB_REPOSITORY_OWNER")" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          docker build -f pkg/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$REF" .
          docker image ls "${REF%:*}"

      - name: Self-check (offline restore of the host's NuGet packages, toolchain files)
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          docker run --rm --network none -v "$PWD:/work/repo" "$IMAGE" bash -euc '
            cp -r /work/repo/pkg/dotnet-host /tmp/h && cd /tmp/h && mkdir -p lib && touch lib/libmlengine.so
            dotnet restore MoonlightHost.csproj
            test -x /opt/tizen-deps/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc
            test -f /opt/backport-deps/ossl-inc/openssl/opensslconf.h
            test ! -e /opt/tizen-deps/tv-libs
            command -v tizen zip unzip
            echo "image self-check OK"'

      # Informational until it has passed once in CI: an offline managed build of the host
      # (the release job runs the full build). A failure here shows as a warning, not a blocked image.
      - name: Self-check (offline managed build of the host)
        continue-on-error: true
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          docker run --rm --network none -v "$PWD:/work/repo" "$IMAGE" bash -euc '
            cp -r /work/repo/pkg/dotnet-host /tmp/h && cd /tmp/h && mkdir -p lib && touch lib/libmlengine.so
            dotnet restore MoonlightHost.csproj && dotnet build MoonlightHost.csproj -c Release -nologo --no-restore'

      - name: Push
        env:
          REF: ${{ steps.img.outputs.ref }}
        run: |
          docker push "$REF"
          # :latest only from the default branch; other branches publish just deps-<hash>
          if [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            docker tag "$REF" "${REF%:*}:latest"
            docker push "${REF%:*}:latest"
          fi
          echo "::notice::published $REF"
