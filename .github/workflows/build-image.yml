name: Build image (self-contained build environment)

# Builds pkg/Dockerfile (all build dependencies baked in; the TV's own libraries are
# NOT included) and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/moonlight-tizen-build:deps-<hash>  (hash of the inputs, pkg/image-tag.sh)
#   ghcr.io/<owner>/moonlight-tizen-build:latest
# build-packages.yml pulls the deps-<hash> tag that matches its own checkout.

on:
  workflow_dispatch:
  push:
    paths:
      - pkg/Dockerfile
      - .dockerignore
      - pkg/image-tag.sh
      - fetch-tizen-sources.sh
      - fetch-backport-deps.sh
      - pkg/dotnet-host/MoonlightHost.csproj
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moonlight-tizen-build" >> "$GITHUB_OUTPUT"
          echo "tag=$(sh pkg/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          NAME: ${{ steps.img.outputs.name }}
          TAG: ${{ steps.img.outputs.tag }}
        run: |
          docker build -f pkg/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$NAME:$TAG" -t "$NAME:latest" .
          docker image ls "$NAME"

      - name: Self-check (offline restore of the host's NuGet packages)
        env:
          IMAGE: ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
        run: |
          docker run --rm --network none -v "$PWD:/work/repo" "$IMAGE" bash -euc '
            cp -r /work/repo/pkg/dotnet-host /tmp/h && cd /tmp/h && mkdir -p lib && touch lib/libmlengine.so
            dotnet restore MoonlightHost.csproj
            test -x /opt/tizen-deps/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc
            test -f /opt/backport-deps/ossl-inc/openssl/opensslconf.h
            test ! -e /opt/tizen-deps/tv-libs
            command -v tizen zip unzip
            echo "image self-check OK"'

      - name: Push
        env:
          NAME: ${{ steps.img.outputs.name }}
          TAG: ${{ steps.img.outputs.tag }}
        run: |
          docker push "$NAME:$TAG"
          docker push "$NAME:latest"
          echo "::notice::published $NAME:$TAG"
