name: Build Moonlight packages (.tpk + .wgt)

# Builds the installable Samsung packages. The native engine links against the
# TV's own libraries (libesplusplayer.so, libecore*, libssl/libcurl, ...), which
# are proprietary Samsung binaries copied from the TV and are NEVER committed. CI
# gets them from the TV_LIBS_URL secret (a tarball with a tv-libs/usr/lib/ tree).
# Without that secret the native packages cannot be built; the job then exits
# cleanly with a note, so forks without the libs don't see red builds.
#
# Everything else (cross toolchain, sysroot, crypto/http deps, moonlight-common-c,
# the web UI) is public and fetched at build time.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.0.2). Empty: build only."
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write   # attach packages to the GitHub Release on a tag

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with moonlight-tizen submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for TV libraries secrets
        id: gate
        run: |
          if [ -n "${{ secrets.TV_LIBS_URL }}" ] && [ -n "${{ secrets.TV_LIBS_TOKEN }}" ]; then
            echo "have_libs=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_libs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TV_LIBS_URL / TV_LIBS_TOKEN not set — skipping native package build."
          fi

      - name: Build toolchain image
        if: steps.gate.outputs.have_libs == 'true'
        run: docker build -t moonlight-tizen-build pkg

      - name: Fetch TV libraries (proprietary, from a private store)
        if: steps.gate.outputs.have_libs == 'true'
        env:
          TV_LIBS_URL: ${{ secrets.TV_LIBS_URL }}
          TV_LIBS_TOKEN: ${{ secrets.TV_LIBS_TOKEN }}
        run: |
          mkdir -p tdeps
          # TV_LIBS_URL points at the tarball in a PRIVATE store (e.g. a private
          # GitHub release asset: https://api.github.com/repos/<owner>/<repo>/releases/assets/<id>).
          # TV_LIBS_TOKEN authorizes the download; the content is never public.
          curl -fsSL \
            -H "Authorization: Bearer $TV_LIBS_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$TV_LIBS_URL" -o tv-libs.tar
          tar -xf tv-libs.tar -C tdeps
          test -f tdeps/tv-libs/usr/lib/libesplusplayer.so \
            || { echo "tv-libs tarball missing usr/lib/libesplusplayer.so"; exit 1; }

      - name: Compute version
        if: steps.gate.outputs.have_libs == 'true'
        env:
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag || github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$REF" in refs/tags/*) is_tag=1 ;; *) is_tag=${INPUT_TAG:+1} ;; esac
          if [ -n "$is_tag" ]; then
            VER=${TAG#v}
          else
            VER=$(git rev-parse --short HEAD)
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build packages
        if: steps.gate.outputs.have_libs == 'true'
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD:/work/repo" \
            -v "$PWD/tdeps:/work/tdeps" \
            -v "$PWD/out:/work/out" \
            -e HOME=/home/developer \
            -e VER \
            moonlight-tizen-build bash -euo pipefail -c '
              cd /work
              REPO=/work/repo MLT=/work/repo/third_party/moonlight-tizen
              DEPS=/work/tdeps BPD=/work/bpd DEPSBUILD=/work/depsbuild

              # 1. public toolchain + sysroot (tv-libs already injected under $DEPS)
              "$REPO/fetch-tizen-sources.sh" "$DEPS"
              # 2. crypto/http deps (headers + mbedTLS/curl sources)
              OUT="$BPD" "$REPO/fetch-backport-deps.sh"
              # 3. core/crypto/gamestream objects + libmbedcrypto_tv.a
              MLT="$MLT" DEPS="$DEPS" BPD="$BPD" OUT="$DEPSBUILD" "$REPO/build-deps-lib.sh"

              # Steps 4-6 run twice: release (normal) and debug (trace) packages.
              for V in release debug; do
                export BUILD_VARIANT=$V
                if [ "$V" = debug ]; then SFX=-debug; else SFX=; fi
                # 4. the engine shared library
                MLT="$MLT" DEPS="$DEPS" BPD="$BPD" DEPSBUILD="$DEPSBUILD" \
                  OUT=/work/engine-$V "$REPO/mlclient/build-engine-so.sh"
                # 5. the .NET host .tpk (Apps2Samsung target)
                "$REPO/pkg/build-tpk.sh" /work/engine-$V/libmlengine.so | tee /work/tpk-$V.log
                TPK=$(sed -n "s/^built: //p" /work/tpk-$V.log | tail -1)
                [ -f "$TPK" ] || { echo "no .tpk for $V"; exit 1; }
                cp "$TPK" "/work/out/org.moonlight.host-$VER$SFX.tpk"
                # 6. the web UI .wgt (needs MLT; signed by the image dev cert)
                # SIGN_PROFILE=dev: the profile built into the image; a freshly added one fails with
                # "Invaild password" (CLI 2.5.25 writes no .pwd). The native/hybrid
                # tpk steps after the .wgt fail in this image ("Cannot provide a package
                # function"), so ignore its exit code and fail only if no .wgt was made.
                REPO="$REPO" MLT="$MLT" DEPS="$DEPS" BPD="$BPD" DEPSBUILD="$DEPSBUILD" \
                  SIGN_PROFILE=dev "$REPO/pkg/build-package.sh" || true
                # shortcut: build-package.sh packages ui/ together with the ui/.buildResult
                # copy made by build-web, so every file is in the .wgt twice. Repackage
                # without it; remove this when the core script is fixed.
                rm -rf "$REPO"/pkg/out/ui/.buildResult "$REPO"/pkg/out/ui/*.wgt
                tizen package -t wgt -s dev -- "$REPO/pkg/out/ui"
                set -- "$REPO"/pkg/out/ui/*.wgt
                [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected exactly one .wgt for $V, got: $*"; exit 1; }
                cp "$1" "/work/out/Moonlight-$VER$SFX.wgt"
              done
              ls -la /work/out
            '

      - name: Upload artifacts
        if: steps.gate.outputs.have_libs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-packages
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: steps.gate.outputs.have_libs == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # a dispatch with a tag creates that tag on the built commit
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: "Normal: Moonlight-${{ env.VER }}.wgt + org.moonlight.host-${{ env.VER }}.tpk. Debug (trace) build: the -debug files. Install one pair, not both."
